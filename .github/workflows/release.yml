name: Release

# Ao criar uma tag de versão (ex.: v1.0.0): testa, publica a imagem no GHCR,
# cria a Release no GitHub, pede ao Render para montar e subir o commit da tag
# e, se a AWS estiver configurada, atualiza a EC2.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # criar a Release
  packages: write # publicar no GHCR
  id-token: write # login na AWS por OIDC (sem chave guardada no GitHub)

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/morea-ifs/horarios-api

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:e2e

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Versão a partir da tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e publicação da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Criar Release no GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            --notes "Imagem: \`${IMAGE}:${{ steps.version.outputs.version }}\`"
      - name: Deploy no Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::Secret RENDER_DEPLOY_HOOK_URL não configurado; deploy no Render não foi disparado."
            exit 0
          fi
          # O Render monta a imagem a partir do repositório; "ref" fixa o commit da tag.
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}" > /dev/null
          echo "Deploy solicitado ao Render com o commit ${GITHUB_SHA} (${GITHUB_REF_NAME})"

  # Atualiza a EC2 pelo SSM (sem SSH), ao lado do Render. Não roda em tag com sufixo (ex.: v1.1.0-rc1)
  # e só roda quando as variáveis da AWS existem em Settings → Secrets and variables → Actions → Variables.
  deploy-aws:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') && vars.AWS_DEPLOY_ROLE != '' && vars.EC2_INSTANCE_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.publish.outputs.version }}
      INSTANCE: ${{ vars.EC2_INSTANCE_ID }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/horarios-api' }}
    steps:
      - name: Credenciais da AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }} # IAM role com ssm:SendCommand e ssm:GetCommandInvocation
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Atualizar a EC2
        run: |
          # O docker-compose da EC2 usa image: ghcr.io/morea-ifs/horarios-api:${HORARIOS_TAG:-latest}
          cmd="cd $DEPLOY_PATH && export HORARIOS_TAG=$VERSION && docker compose pull && docker compose up -d"
          id=$(aws ssm send-command --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --comment "deploy horarios-api $VERSION" \
            --parameters "commands=[\"$cmd\"]" \
            --query Command.CommandId --output text)
          echo "Comando SSM: $id"
          aws ssm wait command-executed --command-id "$id" --instance-id "$INSTANCE" || true
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query '{status: Status, saida: StandardOutputContent, erro: StandardErrorContent}' --output json
          status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" --query Status --output text)
          [ "$status" = "Success" ] || { echo "::error::Deploy na EC2 terminou com status $status"; exit 1; }
