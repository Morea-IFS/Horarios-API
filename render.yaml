# Blueprint do Render (opcional). Banco: use o PostgreSQL do Supabase e cole a URL em DATABASE_URL.
services:
  - type: web
    name: mero-horarios-api
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "300"
      - key: CORS_ORIGINS
        value: "*"
