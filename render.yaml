# Blueprint do Render (opcional: os mesmos valores servem para criar o serviço pelo painel).
# Banco: use o PostgreSQL do Supabase e cole a URL em DATABASE_URL.
# O Render clona este repositório (público) e monta a imagem pelo Dockerfile.
# Deploy automático desligado: a cada tag v*, o workflow Release chama o Deploy Hook
# (secret RENDER_DEPLOY_HOOK_URL) com o commit da tag.
services:
  - type: web
    name: mero-horarios-api
    runtime: docker
    repo: https://github.com/Morea-IFS/Horarios-API
    branch: main
    dockerfilePath: ./Dockerfile
    region: virginia # junto dos outros serviços da área de trabalho; o Supabase (us-east-2) fica ao lado
    plan: free
    autoDeployTrigger: "off"
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "300"
      - key: CORS_ORIGINS
        value: https://mero.morea-ifs.org
